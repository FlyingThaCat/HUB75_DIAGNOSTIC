name: Build & Release Beta Firmware

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Beta Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware Binary
        run: |
          pio run -e esp32dev

      - name: Prepare Artifacts & Versioning
        id: prep
        run: |
          mkdir -p release_files
          cp .pio/build/esp32dev/firmware.bin release_files/esp32_hub75_firmware_beta.bin
          cp ota_push.py release_files/ota_push.py
          
          # Automatic timestamp-based version tag (e.g. v1.0.0-beta-20260810-190520)
          TAG_NAME="v1.0.0-beta-$(date +'%Y%m%d-%H%M%S')"
          RELEASE_NAME="HUB75 Matrix Diagnostic Beta Build (${TAG_NAME})"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Publish Beta Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ steps.prep.outputs.release_name }}
          prerelease: true
          draft: false
          files: |
            release_files/esp32_hub75_firmware_beta.bin
            release_files/ota_push.py
          body: |
            ### 🚀 Automated Beta Release
            This release was automatically built on push to `main` branch.

            #### Download Files:
            - **`esp32_hub75_firmware_beta.bin`**: Ready-to-flash ESP32 firmware binary.
            - **`ota_push.py`**: High-speed BLE Over-The-Air deployment script.

            #### Quick Flash via BLE:
            ```bash
            pip install bleak
            python ota_push.py
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
